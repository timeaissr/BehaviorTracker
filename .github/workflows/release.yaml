name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"

      - name: Verify tag matches app version
        run: |
          TAG_VERSION=${{ steps.version.outputs.version }}
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle)
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle)

          if [ -z "$APP_VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "Unable to read versionName or versionCode from app/build.gradle"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match app version $APP_VERSION"
            echo "Update app/build.gradle before creating the release tag."
            exit 1
          fi

          echo "Building app version $APP_VERSION (versionCode $VERSION_CODE)"

      - name: Decode keystore
        run: |
          python3 -c "import base64, os; open('app/behaviortracker.jks','wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64']))"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create signing config
        run: |
          cat > secrets.properties <<EOF
          storeFile=app/behaviortracker.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BehaviorTracker-v${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Behavior Tracker ${{ steps.version.outputs.tag }}
            
            ### Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.tag }}) for details.
            
            ### Installation
            Download the APK file below and install on your Android device.
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
